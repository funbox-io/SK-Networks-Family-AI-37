<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SK네트웍스 Family AI 캠프 37기 — 수업 · 복습 기록</title>
<meta name="description" content="6개월 과정의 수업 자료와 복습 자료를 하루 단위로 정리한 기록입니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8380d'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E37%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f8fa; --card:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb;
  --accent:#e8380d; --accent-soft:#fdece8; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --basics:#2563eb; --ml:#059669; --llm:#7c3aed; --app:#d97706; --final:#db2777;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1014; --card:#171a20; --fg:#e8eaed; --muted:#9aa1ab; --line:#262a32;
  --accent:#ff6b3d; --accent-soft:#2a1710; --shadow:none;
  --basics:#60a5fa; --ml:#34d399; --llm:#a78bfa; --app:#fbbf24; --final:#f472b6;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px}
header{padding:44px 0 28px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{margin:8px 0 6px;font-size:clamp(24px,4.4vw,36px);letter-spacing:-.02em;line-height:1.25}
.sub{color:var(--muted);font-size:14px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
.pill b{color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.progress{padding:20px 22px;margin-bottom:14px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.prow .big{font-size:22px;font-weight:750;letter-spacing:-.01em}
.prow .small{font-size:13px;color:var(--muted)}
.track{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
h2{font-size:15px;font-weight:700;margin:34px 0 12px;letter-spacing:-.01em}
h2 span{color:var(--muted);font-weight:500}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.phase{padding:14px 15px;border-left:3px solid var(--pc)}
.phase .n{font-size:11px;color:var(--muted);font-weight:600}
.phase .t{font-weight:650;font-size:13.5px;margin:3px 0 2px;letter-spacing:-.01em}
.phase .d{font-size:11.5px;color:var(--muted)}
.phase .track{height:5px;margin-top:9px}
.phase .fill{background:var(--pc)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 12px;position:sticky;top:0;
  background:var(--bg);padding:10px 0;z-index:5}
#q{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--fg);font-size:14px;font-family:inherit}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;
  padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.list{display:flex;flex-direction:column;gap:6px}
.day{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;
  padding:12px 16px;text-decoration:none;border-left:3px solid var(--pc)}
.day:hover{border-color:var(--accent);transform:translateX(2px);transition:transform .12s}
.day.empty{opacity:.5}
.no{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--pc)}
.no small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.dt{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.dt em{font-style:normal;color:var(--muted);font-weight:400}
.ti{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counts{display:flex;gap:5px;font-size:11.5px;white-space:nowrap}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:650}
.badge.g{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.day.today{outline:2px solid var(--accent);outline-offset:-1px}
.day.today .dt::after{content:" 오늘";color:var(--accent);font-size:11px;font-weight:700}
.more{width:100%;padding:13px;border:1px dashed var(--line);background:transparent;color:var(--muted);
  font-family:inherit;font-size:13px;cursor:pointer;border-radius:14px}
.more:hover{color:var(--accent);border-color:var(--accent)}
.empty-msg{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.wk{padding:10px 12px;text-decoration:none;font-size:12.5px}
.wk b{display:block;font-size:13px}
.wk.done{border-color:var(--accent)}
.wk span{color:var(--muted);font-size:11px}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 16px}
@media(max-width:560px){
  .day{grid-template-columns:44px 1fr;gap:10px;padding:11px 13px}
  .counts{grid-column:2;margin-top:2px}
  .controls{position:static}
  .prow{flex-direction:column;align-items:flex-start;gap:2px}
  .prow .big{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Playdata · SK Networks</div>
  <h1 id="title">불러오는 중…</h1>
  <p class="sub" id="tagline">수업 자료와 복습 자료를 하루 단위로 기록합니다.</p>
  <div class="meta" id="meta"></div>
</header>

<div class="card progress">
  <div class="prow">
    <div class="big" id="pct">—</div>
    <div class="small" id="pdetail"></div>
  </div>
  <div class="track"><div class="fill" id="pfill" style="width:0"></div></div>
</div>

<h2>커리큘럼 <span id="phasenote"></span></h2>
<div class="phases" id="phases"></div>

<h2>진도표 <span id="daynote"></span></h2>
<div class="controls">
  <input id="q" type="search" placeholder="날짜 · 주제 · 키워드로 검색  (예: 09-14, 판다스, SQL)" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>
<div class="list" id="list"></div>

<h2>주차별 회고 <span id="wknote"></span></h2>
<div class="weeks" id="weeks"></div>

<footer>
  <span id="foot-repo"></span>
  <span id="foot-gen"></span>
</footer>
</div>

<script>
const COLORS={basics:'var(--basics)',ml:'var(--ml)',llm:'var(--llm)',app:'var(--app)',final:'var(--final)'};
const $=id=>document.getElementById(id);
let DATA=null,filter='all',query='',limit=40,TODAY=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;render()})
  .catch(()=>{$('list').innerHTML='<p class="empty-msg">data.json 을 불러오지 못했습니다.</p>'});

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ghUrl(p){return `https://github.com/${DATA.repo}/tree/main/${p}`}

function render(){
  const d=DATA;
  document.title=`${d.course} — 수업 · 복습 기록`;
  $('title').textContent=d.course;
  $('meta').innerHTML=[
    `교육기간 <b>${d.start} ~ ${d.end}</b>`,
    `<b>${d.total}일</b> · ${d.totalHours}시간`,
    `${d.dailyHours}`,
  ].map(t=>`<span class="pill">${t}</span>`).join('');

  const pct=d.total?Math.round(d.done/d.total*100):0;
  $('pct').textContent=`${d.done} / ${d.total}일 기록  ·  ${pct}%`;
  $('pdetail').textContent=`오늘까지 지난 수업일 ${d.passed}일`;
  requestAnimationFrame(()=>$('pfill').style.width=pct+'%');

  $('phases').innerHTML=d.phases.map((p,i)=>{
    const rows=d.days.filter(x=>x.phaseKey===p.key);
    const done=rows.filter(x=>x.lecture||x.review).length;
    return `<div class="card phase" style="--pc:${COLORS[p.key]}">
      <div class="n">교과목 ${i+1} · ${p.days}일 / ${p.hours}시간</div>
      <div class="t">${esc(p.name)}</div>
      <div class="d">${p.startDate.slice(5)} ~ ${p.endDate.slice(5)}</div>
      <div class="track"><div class="fill" style="width:${Math.round(done/p.days*100)}%"></div></div>
      <div class="d" style="margin-top:5px">${done}/${p.days}일 기록됨</div>
    </div>`}).join('');

  const cur=(d.days.find(x=>x.date>=TODAY)||d.days[d.days.length-1]).phaseKey;
  filter=cur;
  $('chips').innerHTML=[{key:'all',name:'전체'},{key:'recorded',name:'기록된 날만'}]
    .concat(d.phases.map(p=>({key:p.key,name:p.name.split(' (')[0]})))
    .map(c=>`<button class="chip" data-k="${c.key}" aria-pressed="${c.key===filter}">${esc(c.name)}</button>`).join('');
  $('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.k;limit=40;
    [...$('chips').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===filter));renderList()};

  $('q').oninput=e=>{query=e.target.value.trim().toLowerCase();limit=40;renderList()};
  renderList();

  $('weeks').innerHTML=d.weeks.map(w=>{
    const done=w.written;
    return `<a class="card wk${done?' done':''}" ${w.file?`href="${ghUrl('weekly/'+w.file)}"`:''}>
      <b>${w.week}주차 ${done?'✅':''}</b>
      <span>${w.start.slice(5)} ~ ${w.end.slice(5)}</span></a>`}).join('');
  $('wknote').textContent=`${d.weeks.filter(w=>w.written).length}/${d.weeks.length}주 작성됨`;

  $('foot-repo').innerHTML=`<a href="https://github.com/${d.repo}">github.com/${d.repo}</a>`;
  $('foot-gen').textContent=`마지막 갱신 ${d.generated}`;
}

function renderList(){
  const d=DATA;
  let rows=d.days;
  if(filter==='recorded') rows=rows.filter(r=>r.lecture||r.review);
  else if(filter!=='all') rows=rows.filter(r=>r.phaseKey===filter);
  if(query) rows=rows.filter(r=>[r.date,r.title,(r.tags||[]).join(' '),r.phase,'day'+r.no,r.week+'주']
    .join(' ').toLowerCase().includes(query));

  $('daynote').textContent=`${rows.length}일`;
  if(!rows.length){$('list').innerHTML='<p class="empty-msg">조건에 맞는 날이 없습니다.</p>';return}
  const shown=rows.slice(0,limit), more=rows.length-shown.length;

  $('list').innerHTML=shown.map(r=>{
    const has=r.lecture||r.review;
    const counts=has
      ? `<span class="badge${r.lecture?'':' g'}">📄 수업 ${r.lecture}</span><span class="badge${r.review?'':' g'}">📝 복습 ${r.review}</span>`
      : `<span class="badge g">${r.exists?'폴더만 생성됨':'예정'}</span>`;
    const inner=`<div class="no">${String(r.no).padStart(3,'0')}<small>${r.week}주</small></div>
      <div><div class="dt">${r.date} <em>(${r.weekday})</em></div>
      <div class="ti">${esc(r.title||r.phase)}</div></div>
      <div class="counts">${counts}</div>`;
    const cls='card day'+(r.date===TODAY?' today':'');
    return r.exists
      ? `<a class="${cls}" style="--pc:${COLORS[r.phaseKey]}" href="${ghUrl('days/'+r.date)}">${inner}</a>`
      : `<div class="${cls} empty" style="--pc:${COLORS[r.phaseKey]}">${inner}</div>`;
  }).join('') + (more>0?`<button class="card more" id="more">남은 ${more}일 더 보기</button>`:'');
  if(more>0) $('more').onclick=()=>{limit+=60;renderList()};
}
</script>
</body>
</html>
